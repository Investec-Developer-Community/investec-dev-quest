name: Swag claim request
description: Claim your prize after completing ALL levels
labels: [swag-claim]

body:
  - type: markdown
    attributes:
      value: |
        Congrats on finishing the quest! Run `pnpm game claim` to save your completion bundle and open this form pre-filled. No screenshot is needed.

        The current campaign has 23 missions. Review the bundle, enter your GitHub handle, and confirm your own completion before submitting. A maintainer reviews the claim and shares the claim form link.

        The SHA-256 hash checks bundle integrity; local progress and timestamps are self-reported, not independent proof of solving. Enter your total play time below, excluding breaks and time away from the game. This time is self-reported, not measured or verified, and is not covered by the bundle hash.

  - type: input
    id: github_username
    attributes:
      label: GitHub username
      description: Your GitHub handle (so we can tag you in the response)
      placeholder: "yourhandle"
    validations:
      required: true

  - type: textarea
    id: claim_bundle
    attributes:
      label: Completion claim bundle
      description: "Pre-filled by pnpm game claim. If opening this form manually, paste the JSON from the saved claim file."
      placeholder: "Paste the complete JSON bundle here"
      render: json
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I completed all levels myself (not copied/generated)
          required: true
        - label: My claim bundle includes ALL current missions complete
          required: true

  - type: textarea
    id: feedback
    attributes:
      label: Feedback (optional)
      description: "Anything you loved, hated, or want to see next? Helps us improve the game."
    validations:
      required: false

  - type: input
    id: timestamp
    attributes:
      label: How long did it take you to complete?
      description: "Please enter your honest total time spent playing across all sessions, excluding breaks and time away from the game. This time is self-reported, not automatically measured."
      placeholder: "HH:MM:SS (e.g., 01:40:02)"
    validations:
      required: true
